name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    # Postgres для e2e: тесты накатывают миграции на базу fanera_test
    # (адрес по умолчанию — в apps/server/test/test-database-url.ts)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fanera
          POSTGRES_PASSWORD: fanera
          POSTGRES_DB: fanera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fanera -d fanera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # postinstall сервера запускает prisma generate: без клиента не пройдут typecheck и сборка
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter server lint
      - name: Typecheck
        run: pnpm --filter server typecheck
      - name: Unit tests
        run: pnpm --filter server test
      - name: E2E tests
        run: pnpm --filter server test:e2e
      - name: Build
        run: pnpm --filter server build
