name: docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"

permissions:
  contents: read

jobs:
  system-design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Зависимости backlog, ссылки на AC / Р-NN, ссылки и якоря, свежесть SVG
      - name: Согласованность docs/system-design
        run: node docs/system-design/scripts/check.mjs

      # Ошибки схемы и YAML роняют проверку, стилевые предупреждения — нет
      - name: OpenAPI валиден
        run: npx --yes @redocly/cli@2.71.2 lint --extends=minimal --format=github-actions docs/system-design/api/rest_api.yml
