# Окружение для локальной разработки: только инфраструктура.
# Сам Nest запускается на хосте через pnpm, не в контейнере.
# Значения по умолчанию можно переопределить в .env рядом с этим файлом (см. .env.example).
name: fanera

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fanera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fanera}
      POSTGRES_DB: ${POSTGRES_DB:-fanera}
    # 127.0.0.1 — порт доступен только с этой машины, не из локальной сети
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    # С Postgres 18 данные лежат в /var/lib/postgresql/18/docker,
    # поэтому монтируем родительскую папку, а не /var/lib/postgresql/data
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # $$ — переменная внутри контейнера, compose её не подставляет
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
