role</text><text x="17" y="242.97" fill="#000" font-size="11" textLength="160.628" font-family="'Helvetica'">(только неотозванные ссылки)</text></g><!--entity PS--><g class="entity" data-qualified-name="PS" id="ent0004" data-source-line="18"><rect x="402.79" y="114.5" width="209.181" height="57" fill="#FFF8E1" style="stroke:#555;stroke-width:0.5;" rx="6" ry="6"/><text x="412.79" y="134.51" fill="#000" font-size="13" textLength="164.722" font-family="'Helvetica'">PermissionService.getRole()</text><text x="412.79" y="147.51" fill="#000" font-size="13" textLength="144.111" font-weight="700" font-family="'Helvetica'">max(всех источников)</text><text x="412.79" y="158.97" fill="#000" font-size="11" textLength="189.181" font-family="'Helvetica'">owner > editor > viewer > нет доступа</text></g><!--entity HG--><g class="entity" data-qualified-name="HG" id="ent0005" data-source-line="20"><rect x="782.24" y="79" width="133.276" height="44" fill="#E8EEF7" style="stroke:#555;stroke-width:0.5;" rx="6" ry="6"/><text x="792.24" y="99.01" fill="#000" font-size="13" textLength="70.802" font-family="'Helvetica'">HTTP guard</text><text x="792.24" y="110.47" fill="#000" font-size="11" textLength="113.276" font-family="'Helvetica'">каждый REST-запрос</text></g><!--entity WG--><g class="entity" data-qualified-name="WG" id="ent0006" data-source-line="21"><rect x="756.64" y="158.5" width="184.479" height="55" fill="#E8EEF7" style="stroke:#555;stroke-width:0.5;" rx="6" ry="6"/><text x="766.64" y="178.51" fill="#000" font-size="13" textLength="57.802" font-family="'Helvetica'">WS guard</text><text x="766.64" y="189.97" fill="#000" font-size="11" textLength="135.067" font-family="'Helvetica'">при подключении к доске</text><text x="766.64" y="200.97" fill="#000" font-size="11" textLength="164.479" font-family="'Helvetica'">и на каждом пишущем событии</text></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="30"><path d="M318.12,206.5 L318.12,255.5 A0,0 0 0 0 318.12